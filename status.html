<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Implantação Medicine</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="css">
:root{
  --ground:#f2f4fa; --surface:#ffffff; --surface2:#eaeef7; --sunken:#e3e8f4;
  --ink:#1e1e33; --ink-soft:#55557a; --ink-mute:#8686a6;
  --line:#dbe1ef; --line-soft:#e8ecf6;
  --navy:#1a1a2e; --navy2:#0f3460; --accent:#e94560;
  --done:#0d8f6f; --done-bg:#dff5ee;
  --partial:#b0730a; --partial-bg:#fdf0d9;
  --pending:#5f5f85; --pending-bg:#e9ebf5;
  --blocked:#c22e3f; --blocked-bg:#fce4e7;
  --unknown:#7b7b9c; --unknown-bg:#eeeff6;
  --on-navy:#ffffff; --on-navy-soft:#b9c2dd;
  --shadow:0 1px 2px rgba(26,26,46,.06), 0 8px 24px rgba(26,26,46,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101020; --surface:#1a1a2c; --surface2:#22223a; --sunken:#161628;
    --ink:#ecedf6; --ink-soft:#a8aac6; --ink-mute:#7c7e9c;
    --line:#31314d; --line-soft:#282842;
    --navy:#12121f; --navy2:#123059; --accent:#ff5c76;
    --done:#3ad5a8; --done-bg:#0d3a30;
    --partial:#f2b23e; --partial-bg:#3d2f10;
    --pending:#a3a5c8; --pending-bg:#26263c;
    --blocked:#ff7183; --blocked-bg:#3d1a20;
    --unknown:#8e90b2; --unknown-bg:#23233a;
    --on-navy:#ffffff; --on-navy-soft:#a9b3d0;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.32);
  }
}
:root[data-theme="dark"]{
  --ground:#101020; --surface:#1a1a2c; --surface2:#22223a; --sunken:#161628;
  --ink:#ecedf6; --ink-soft:#a8aac6; --ink-mute:#7c7e9c;
  --line:#31314d; --line-soft:#282842;
  --navy:#12121f; --navy2:#123059; --accent:#ff5c76;
  --done:#3ad5a8; --done-bg:#0d3a30;
  --partial:#f2b23e; --partial-bg:#3d2f10;
  --pending:#a3a5c8; --pending-bg:#26263c;
  --blocked:#ff7183; --blocked-bg:#3d1a20;
  --unknown:#8e90b2; --unknown-bg:#23233a;
  --on-navy:#ffffff; --on-navy-soft:#a9b3d0;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Archivo',ui-sans-serif,system-ui,sans-serif; text-wrap:balance; margin:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}
.wrap{max-width:1080px; margin:0 auto; padding:0 24px}

/* header */
header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%); color:var(--on-navy); position:relative; overflow:hidden}
header::after{content:''; position:absolute; right:-90px; top:-110px; width:360px; height:360px; border-radius:50%; background:rgba(233,69,96,.16)}
.hd{position:relative; padding:40px 0 34px}
.eyebrow{display:inline-block; background:var(--accent); color:#fff; font-size:10.5px; font-weight:700;
  letter-spacing:1.6px; text-transform:uppercase; padding:5px 11px; border-radius:20px; margin-bottom:14px;
  font-family:'IBM Plex Mono',monospace}
header h1{font-size:clamp(1.7rem,4vw,2.3rem); font-weight:800; letter-spacing:-.02em; margin-bottom:8px}
header .lede{color:var(--on-navy-soft); max-width:60ch; font-size:.95rem}
.facts{display:flex; flex-wrap:wrap; gap:28px; margin-top:26px}
.fact-l{font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--on-navy-soft); font-family:'IBM Plex Mono',monospace}
.fact-v{font-size:.92rem; font-weight:600; margin-top:2px}
.fact-v.late{color:#ff8ea0}

/* scoreboard */
.board{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px; margin:-26px 0 0;
  position:relative; z-index:1}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow)}
.tile .n{font-size:1.9rem; font-weight:800; font-family:'Archivo',sans-serif; line-height:1.1; font-variant-numeric:tabular-nums}
.tile .l{font-size:10.5px; letter-spacing:1.1px; text-transform:uppercase; color:var(--ink-mute); margin-top:3px; font-family:'IBM Plex Mono',monospace}
.tile.t-done .n{color:var(--done)} .tile.t-partial .n{color:var(--partial)}
.tile.t-pending .n{color:var(--pending)} .tile.t-blocked .n{color:var(--blocked)}
.tile.t-unknown .n{color:var(--unknown)}

.bar{display:flex; height:8px; border-radius:99px; overflow:hidden; background:var(--sunken); margin:18px 0 0; border:1px solid var(--line)}
.bar i{display:block; height:100%}
.bar i.done{background:var(--done)} .bar i.partial{background:var(--partial)}
.bar i.pending{background:var(--pending)} .bar i.blocked{background:var(--blocked)}
.bar i.unknown{background:var(--unknown); opacity:.45}

/* notice */
.notice{margin:22px 0 0; border-left:3px solid var(--accent); background:var(--surface); border-radius:0 10px 10px 0;
  padding:14px 18px; font-size:.9rem; color:var(--ink-soft); box-shadow:var(--shadow)}
.notice b{color:var(--ink)}

/* sections */
section{margin-top:38px}
.sec-hd{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:4px}
.sec-hd h2{font-size:1.12rem; font-weight:700; letter-spacing:-.01em}
.sec-hd .when{font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-mute); font-family:'IBM Plex Mono',monospace}
.sec-sub{color:var(--ink-soft); font-size:.88rem; margin:0 0 14px}

.rows{background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow)}
.row{display:grid; grid-template-columns:34px 1fr 168px; gap:14px; align-items:start;
  padding:13px 18px; border-top:1px solid var(--line-soft)}
.row:first-child{border-top:none}
.row.s-done{background:linear-gradient(90deg,var(--done-bg) 0 3px,transparent 3px)}
.row.s-partial{background:linear-gradient(90deg,var(--partial-bg) 0 3px,transparent 3px)}
.row.s-blocked{background:linear-gradient(90deg,var(--blocked-bg) 0 3px,transparent 3px)}
.num{font-size:12px; color:var(--ink-mute); padding-top:3px; font-family:'IBM Plex Mono',monospace}
.ttl{font-weight:500; font-size:.94rem}
.meta{font-size:.8rem; color:var(--ink-mute); margin-top:2px}
.tag{display:inline-block; font-size:9.5px; letter-spacing:.9px; text-transform:uppercase; font-weight:600;
  padding:2px 7px; border-radius:5px; background:var(--surface2); color:var(--ink-soft); margin-left:8px;
  font-family:'IBM Plex Mono',monospace; vertical-align:1px}
.tag.novo{background:var(--accent); color:#fff}
.ctl{display:flex; flex-direction:column; gap:6px}
select.st{width:100%; appearance:none; border-radius:7px; border:1px solid var(--line); padding:6px 26px 6px 10px;
  font:inherit; font-size:.82rem; font-weight:600; background:var(--surface2); color:var(--ink); cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
select.st:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
select.st.v-done{background-color:var(--done-bg); color:var(--done); border-color:var(--done)}
select.st.v-partial{background-color:var(--partial-bg); color:var(--partial); border-color:var(--partial)}
select.st.v-pending{background-color:var(--pending-bg); color:var(--pending)}
select.st.v-blocked{background-color:var(--blocked-bg); color:var(--blocked); border-color:var(--blocked)}
select.st.v-unknown{background-color:var(--unknown-bg); color:var(--unknown)}
input.note{width:100%; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:7px; padding:5px 9px; font:inherit; font-size:.78rem}
input.note::placeholder{color:var(--ink-mute)}
input.note:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

/* pendencias */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; box-shadow:var(--shadow)}
.card h3{font-size:.98rem; font-weight:700; margin-bottom:6px}
.card p{margin:0; font-size:.87rem; color:var(--ink-soft)}
.card .k{font-size:10px; letter-spacing:1.1px; text-transform:uppercase; color:var(--accent);
  font-family:'IBM Plex Mono',monospace; font-weight:600; display:block; margin-bottom:7px}

footer{margin:46px 0 30px; padding-top:16px; border-top:1px solid var(--line);
  font-size:.78rem; color:var(--ink-mute); display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap}
.saving{position:fixed; right:16px; bottom:16px; background:var(--navy); color:#fff; font-size:.78rem;
  padding:8px 14px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:9;
  font-family:'IBM Plex Mono',monospace}
.saving.on{opacity:.94}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.tools{display:flex; gap:9px; margin-top:22px; flex-wrap:wrap; position:relative; z-index:1}
button.tool{font:inherit; font-size:.82rem; font-weight:600; cursor:pointer; border-radius:8px;
  padding:8px 14px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
button.tool:hover{border-color:var(--accent); color:var(--accent)}
button.tool:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
@media (max-width:640px){
  .row{grid-template-columns:26px 1fr; }
  .ctl{grid-column:2; }
}
</style>
</head>
<body>

<div id="root"></div>
<div class="saving" id="toast"></div>

<script id="app">
(function(){
  "use strict";

  var STATUS = {
    done:    {label:"Entregue",    cls:"done"},
    partial: {label:"Parcial",     cls:"partial"},
    pending: {label:"Não iniciado",cls:"pending"},
    blocked: {label:"Bloqueado",   cls:"blocked"},
    unknown: {label:"A confirmar", cls:"unknown"}
  };
  var ORDER = ["done","partial","pending","blocked","unknown"];

  var GROUPS = [
    {id:"f1", t:"Fase 01 — Discovery & Modelagem", when:"Semanas 1–2",
     s:"Levantamento dos canais, portfólio de cursos, tom de voz da IA e coleta de acessos."},
    {id:"f2", t:"Fase 02 — Chatwoot & IA", when:"Semanas 3–4",
     s:"Infraestrutura, integração dos três canais, treinamento da IA e camada de segurança."},
    {id:"f3", t:"Fase 03 — SDR por IA e go-live", when:"Semanas 5–6",
     s:"Qualificação automática, handoff comercial, treinamento da equipe e entrega em produção."},
    {id:"sv", t:"Serviços continuados", when:"Pós go-live",
     s:"Incluídos na mensalidade durante toda a vigência contratual."}
  ];

  var ASSINATURA = new Date(2026,4,21);   // 21/05/2026
  var GOLIVE     = new Date(2026,6,2);    // 02/07/2026 — 6 semanas após a assinatura

  var state = JSON.parse(document.getElementById("state").textContent);

  // As marcações moram na própria URL. Marcar um item reescreve o endereço;
  // copiar e enviar o link é tudo o que existe para compartilhar o quadro.
  // Um caractere por item, na ordem, e as observações só entram se houver.
  var CODE = {unknown:"-", done:"d", partial:"p", pending:"n", blocked:"b"};
  var FROM_CODE = {};
  Object.keys(CODE).forEach(function(k){ FROM_CODE[CODE[k]] = k; });

  function b64e(str){
    return btoa(unescape(encodeURIComponent(str)))
      .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  function b64d(str){
    var s = str.replace(/-/g,"+").replace(/_/g,"/");
    while(s.length % 4) s += "=";
    return decodeURIComponent(escape(atob(s)));
  }

  function encodeState(){
    var out = "s=" + state.items.map(function(i){ return CODE[i.s] || "-"; }).join("");
    var notes = {};
    state.items.forEach(function(i){ if(i.o2) notes[i.n] = i.o2; });
    if(Object.keys(notes).length) out += "&n=" + b64e(JSON.stringify(notes));
    return out;
  }

  function decodeState(){
    var hash = String(location.hash || "").replace(/^#/, "");
    if(!hash) return;
    var parts = {};
    hash.split("&").forEach(function(kv){
      var i = kv.indexOf("=");
      if(i > 0) parts[kv.slice(0,i)] = kv.slice(i+1);
    });
    if(parts.s){
      var chars = parts.s.split("");
      state.items.forEach(function(item, idx){
        var st = FROM_CODE[chars[idx]];
        if(st) item.s = st;
      });
    }
    if(parts.n){
      var notes;
      try{ notes = JSON.parse(b64d(parts.n)); }catch(e){ return; }
      state.items.forEach(function(item){
        if(typeof notes[item.n] === "string") item.o2 = notes[item.n];
      });
    }
  }

  // Safari limita a frequência de replaceState, e digitar numa observação
  // dispara a cada tecla — daí o atraso curto.
  var urlTimer = null;
  function syncUrl(){
    clearTimeout(urlTimer);
    urlTimer = setTimeout(function(){
      try{ history.replaceState(null, "", "#" + encodeState()); }catch(e){}
    }, 250);
  }
  function shareUrl(){
    return location.origin + location.pathname + "#" + encodeState();
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function fmt(d){
    return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
  }
  function daysBetween(a,b){ return Math.round((b-a)/86400000); }

  function counts(){
    var c={done:0,partial:0,pending:0,blocked:0,unknown:0};
    state.items.forEach(function(i){ c[i.s]=(c[i.s]||0)+1; });
    return c;
  }

  function render(){
    var c = counts(), total = state.items.length;
    var late = daysBetween(GOLIVE, new Date());
    var lateTxt = late > 0 ? late + " dias além do prazo" : "dentro do prazo";

    var h = "";

    h += '<header><div class="wrap hd">'
       + '<span class="eyebrow">Status de implantação</span>'
       + '<h1>Medicine × Tudo Mudou!</h1>'
       + '<p class="lede">Acompanhamento dos entregáveis contratados na Proposta 003/2026 e no Anexo I — Roadmap de Implantação, parte integrante do contrato.</p>'
       + '<div class="facts">'
       +   fact("Contrato assinado", fmt(ASSINATURA))
       +   fact("Go-live previsto", fmt(GOLIVE))
       +   fact(late>0?"Situação do prazo":"Prazo", lateTxt, late>0)
       +   fact("Entregáveis", total)
       + '</div></div></header>';

    h += '<div class="wrap">';

    h += '<div class="board">'
       + tile(c.done,"Entregues","t-done")
       + tile(c.partial,"Parciais","t-partial")
       + tile(c.pending,"Não iniciados","t-pending")
       + tile(c.blocked,"Bloqueados","t-blocked")
       + tile(c.unknown,"A confirmar","t-unknown")
       + '</div>';

    h += '<div class="bar" role="img" aria-label="Distribuição dos '+total+' entregáveis por situação">'
       + ORDER.map(function(k){
           var pct = (c[k]/total)*100;
           return pct ? '<i class="'+k+'" style="width:'+pct.toFixed(2)+'%"></i>' : '';
         }).join("")
       + '</div>';

    if(c.unknown === total){
      h += '<div class="notice"><b>Nenhum status foi preenchido ainda.</b> Todos os '+total
         + ' entregáveis estão marcados como “a confirmar”. Marque a situação de cada um nos seletores à direita.</div>';
    }

    h += '<div class="tools">'
       + '<button class="tool" type="button" data-act="copy">Copiar link do quadro</button>'
       + '<button class="tool" type="button" data-act="reset">Limpar marcações</button>'
       + '</div>';
    h += '<p class="sec-sub" style="margin-top:8px">'
       + 'As marcações ficam no endereço da página. Copie o link e envie: quem abrir vê o quadro exatamente como você marcou.'
       + '</p>';

    GROUPS.forEach(function(g){
      var items = state.items.filter(function(i){ return i.f===g.id; });
      h += '<section><div class="sec-hd"><h2>'+esc(g.t)+'</h2><span class="when">'+esc(g.when)+'</span></div>'
         + '<p class="sec-sub">'+esc(g.s)+'</p><div class="rows">'
         + items.map(row).join("")
         + '</div></section>';
    });

    h += '<section><div class="sec-hd"><h2>Pontos em aberto</h2></div>'
       + '<p class="sec-sub">Questões contratuais que independem do andamento técnico.</p>'
       + '<div class="cards">'
       + card("Cláusula 7.1","Meta de recuperação em 4 horas",
              "A proposta prometeu restabelecimento em até 4 horas. O contrato prevê suporte apenas de segunda a sexta, das 9h às 18h. Enquanto não houver aditivo definindo regime de sobreaviso, a meta vale dentro da janela comercial.")
       + card("Cláusula 2.3","Contagem do prazo de implantação",
              "O prazo de go-live é prorrogado proporcionalmente por atrasos atribuíveis à contratante na entrega de acessos, validações e aprovações. Prorrogações precisam estar registradas para produzir efeito.")
       + card("Anexo I §6","Escopo não incluído",
              "Conteúdo e copywriting, integrações além dos canais contratados — inclusive plataforma de e-commerce —, infraestrutura (VPS, domínio, SSL) e custos de APIs de IA seguem fora do escopo e são orçados à parte.")
       + '</div></section>';

    h += '<footer><span>Medicine · Med Cine Editora e Filmagem Ltda — CNPJ 07.050.619/0001-50</span>'
       + '<span class="mono">Proposta 003/2026 · Anexo I</span></footer>';

    h += '</div>';

    document.getElementById("root").innerHTML = h;
    wire();
  }

  function fact(label,value,isLate){
    return '<div><div class="fact-l">'+esc(label)+'</div>'
         + '<div class="fact-v'+(isLate?" late":"")+' mono">'+esc(value)+'</div></div>';
  }
  function tile(n,label,cls){
    return '<div class="tile '+cls+'"><div class="n">'+n+'</div><div class="l">'+esc(label)+'</div></div>';
  }
  function card(k,title,body){
    return '<div class="card"><span class="k">'+esc(k)+'</span><h3>'+esc(title)+'</h3><p>'+esc(body)+'</p></div>';
  }
  function row(i){
    var opts = ORDER.map(function(k){
      return '<option value="'+k+'"'+(i.s===k?' selected':'')+'>'+STATUS[k].label+'</option>';
    }).join("");
    return '<div class="row s-'+i.s+'" data-n="'+i.n+'">'
      + '<div class="num">'+String(i.n).padStart(2,"0")+'</div>'
      + '<div><div class="ttl">'+esc(i.t)+(i.o?'<span class="tag'+(i.o.indexOf("Proposta")===0?" novo":"")+'">'+esc(i.o)+'</span>':'')+'</div>'
      +   (i.m?'<div class="meta">'+esc(i.m)+'</div>':'')
      + '</div>'
      + '<div class="ctl">'
      +   '<select class="st v-'+i.s+'" aria-label="Situação do item '+i.n+'">'+opts+'</select>'
      +   '<input class="note" value="'+esc(i.o2||"")+'" placeholder="observação" aria-label="Observação do item '+i.n+'">'
      + '</div></div>';
  }

  function wire(){
    document.querySelectorAll(".row").forEach(function(el){
      var n = Number(el.dataset.n);
      var item = state.items.filter(function(i){ return i.n===n; })[0];
      el.querySelector("select").addEventListener("change", function(e){
        item.s = e.target.value;
        render();
        save();
      });
      el.querySelector("input.note").addEventListener("input", function(e){
        item.o2 = e.target.value;
        save();
      });
    });
  }

  function toast(msg,keep){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    if(!keep) setTimeout(function(){ t.classList.remove("on"); }, 1800);
  }

  function save(){
    syncUrl();
  }

  function copyLink(){
    var url = shareUrl();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){
        toast("Link copiado");
      }).catch(function(){ prompt("Copie o link do quadro:", url); });
    } else {
      prompt("Copie o link do quadro:", url);
    }
  }

  function reset(){
    if(!window.confirm("Limpar todas as marcações e voltar tudo para “a confirmar”?")) return;
    state.items.forEach(function(i){ i.s = "unknown"; i.o2 = ""; });
    syncUrl(); render();
  }

  document.addEventListener("click", function(e){
    var t = e.target.closest ? e.target.closest("[data-act]") : null;
    if(!t) return;
    if(t.dataset.act === "copy") copyLink();
    if(t.dataset.act === "reset") reset();
  });

  decodeState();
  render();
})();
</script>
</body>
</html>
